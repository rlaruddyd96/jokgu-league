<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOKGU LEAGUE v1.4</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#0d1729;color:#eef4ff}*{box-sizing:border-box}body{margin:0}header{padding:24px max(16px,calc((100vw - 980px)/2));background:linear-gradient(110deg,#1b2b49,#345994)}header small{letter-spacing:2px;color:#b8d5ff}h1{margin:8px 0;font-size:28px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:10px 0}main{max-width:980px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;padding:10px 0 18px}button{font:inherit;cursor:pointer}nav button,.secondary{background:#2d4160;color:#fff;border:1px solid #4b6487;border-radius:10px;padding:11px}nav .on,.primary{background:#3972cd;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700}.panel{background:#1d2c46;border:1px solid #374d6d;border-radius:15px;padding:18px;margin:12px 0}.notice{background:#30415e;border-radius:10px;padding:12px;margin:10px 0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#2c4262;text-align:center;padding:15px 4px;border-radius:10px}.stat b{display:block;font-size:22px}.muted,.stat small{color:#aec0d8;font-size:12px}label{display:block;color:#b8cbe4;font-size:12px;margin:11px 0 5px}input,select{width:100%;min-width:0;padding:11px;border:1px solid #526888;border-radius:9px;background:#101c30;color:#fff;font:inherit}.wide{width:100%;margin-top:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 0;border-bottom:1px solid #364b68}.row:last-child{border:0}.row>*{min-width:0}.tag{display:inline-block;background:#354f74;border-radius:6px;padding:4px 7px;font-size:11px}.team{background:#253953;padding:12px;border-radius:12px}.team select{margin:5px 0}.mini{font-size:12px;padding:7px}.danger{background:#783c50}.good{color:#83dfb0}.chart{max-width:370px;width:100%;display:block;margin:auto}.statrow{display:flex;align-items:center;gap:8px;margin:9px 0}.statrow label{width:66px;margin:0}.statrow input{width:80px}.bar{height:8px;background:#334965;border-radius:5px;flex:1;overflow:hidden}.bar>i{display:block;background:#54a0f5;height:100%}#toast{position:fixed;bottom:20px;left:5%;width:90%;background:#32689f;text-align:center;padding:14px;border-radius:10px;display:none;z-index:10}button:disabled{opacity:.5}.clickname{border:0;background:none;color:#d9eaff;font-weight:700;text-decoration:underline;text-decoration-color:#6689b6;text-underline-offset:4px;padding:3px 0}.pill{display:inline-block;padding:5px 9px;background:#324d70;border-radius:20px;font-size:12px}.listcheck{display:flex;gap:9px;align-items:center;padding:8px 10px;background:#253953;border-radius:9px}.listcheck input{width:auto}.teamcard{border:1px solid #426083;background:#263a55;border-radius:12px;padding:12px;min-width:0}.teamcard h3{margin-top:0}.teamcard select{margin:6px 0}.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.smalltable{width:100%;border-collapse:collapse;font-size:13px}.smalltable td,.smalltable th{padding:9px 5px;border-bottom:1px solid #405471;text-align:left}.svgline{width:100%;height:auto;display:block}.btnline{display:flex;gap:7px;flex-wrap:wrap}.btnline button{flex:1}.note{color:#aec0d8;font-size:12px;line-height:1.6} @media(max-width:450px){main{padding:10px}.panel{padding:12px}.team{padding:8px}.team select{padding:9px 4px;font-size:12px}}
</style></head><body><header><small>JOKGU LEAGUE · v1.4</small><h1>JL · SEASON RANKINGS</h1><div class="muted">통합 개인 RP · PLAYER STATS</div></header><main><div id="status" class="notice">데이터 연결 중...</div><nav id="nav"></nav><div id="app"></div></main><div id="toast"></div><script>
'use strict';
const API='https://fwwzuiqbfrbcxdcnbjiq.supabase.co/functions/v1/jokgu-league';
const $=id=>document.getElementById(id);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=[['attack','공격'],['serve','서브'],['heading','헤딩'],['receive','리시브'],['toss','토스']];
const statKey=k=>'stat_'+k;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const tier=(r,n)=>n===0?'UNRANKED':r>=1600?'CHALLENGER':r>=1400?'DIAMOND':r>=1200?'PLATINUM':r>=1000?'GOLD':r>=800?'SILVER':'BRONZE';
let db={players:[],matches:[],seasons:[]},stats={},tab='home',season='',editing=null,profileId=null,sizeA=4,sizeB=4,busy=false,loaded=false,sortMode='rp';
let matching={attendees:[],sizes:[3,3],mode:'rp',teams:[],waiting:[],pair:[0,1],counter:0},pendingTeams=null;
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4000)}
async function api(op,opts={}){const r=await fetch(API+'?api='+op,{...opts,cache:'no-store'});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{throw Error('서버 응답 오류: '+r.status)}if(!r.ok||j?.error)throw Error(j?.error||'서버 오류');return j}
async function load(renderAfter=true){try{const next=await api('state');if(!Array.isArray(next.players)||!Array.isArray(next.matches)||!Array.isArray(next.seasons))throw Error('데이터 형식 오류');db=next;loaded=true;if(!db.seasons.some(s=>s.id===season))season=db.seasons.find(s=>s.active)?.id||db.seasons[0]?.id||'';calculate();$('status').textContent='● 온라인 연결 · 최신 기록 동기화';if(renderAfter)render()}catch(e){$('status').textContent='연결 오류: '+e.message;toast(e.message)}}
async function write(action,data,admin=false){let password=null;if(admin){password=prompt('관리자 비밀번호');if(password===null)return false;if(!password){toast('관리자 비밀번호를 입력하세요');return false}}if(busy)return false;busy=true;try{await api('write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data,password})});busy=false;await load(false);toast('저장 완료');return true}catch(e){busy=false;toast('오류: '+e.message);return false}}
function calculate(){stats={};db.players.forEach(p=>stats[p.id]={rp:1000,w:0,l:0,sw:0,sl:0});const games=db.matches.filter(m=>m.season_id===season).slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))||String(a.id).localeCompare(String(b.id)));for(const m of games){const a=m.team_a,b=m.team_b;if(!Array.isArray(a)||!Array.isArray(b)||![3,4].includes(a.length)||![3,4].includes(b.length)||!['A','B'].includes(m.winner))continue;const all=[...a,...b];if(new Set(all).size!==all.length||!all.every(id=>stats[id]))continue;const ra=a.reduce((s,id)=>s+stats[id].rp,0)/a.length,rb=b.reduce((s,id)=>s+stats[id].rp,0)/b.length;const change=32*((m.winner==='A'?1:0)-1/(1+Math.pow(10,(rb-ra)/400)));for(const id of a){const s=stats[id];s.rp+=change;s.w+=m.winner==='A'?1:0;s.l+=m.winner==='B'?1:0;s.sw+=m.winner==='A'?2:Number(m.loser_sets);s.sl+=m.winner==='A'?Number(m.loser_sets):2}for(const id of b){const s=stats[id];s.rp-=change;s.w+=m.winner==='B'?1:0;s.l+=m.winner==='A'?1:0;s.sw+=m.winner==='B'?2:Number(m.loser_sets);s.sl+=m.winner==='B'?Number(m.loser_sets):2}}}
function evaluated(p){return fields.every(([k])=>Number.isInteger(p[statKey(k)])&&p[statKey(k)]>=0&&p[statKey(k)]<=10)}
function ovr(p){return evaluated(p)?fields.reduce((s,[k])=>s+p[statKey(k)],0)/5:null}
function leaders(){return db.players.map(p=>({...p,...stats[p.id]})).sort((a,b)=>{const na=a.w+a.l,nb=b.w+b.l;if((na>0)!==(nb>0))return na>0?-1:1;if(!na&&!nb)return a.name.localeCompare(b.name,'ko');return b.rp-a.rp||b.w-a.w||a.name.localeCompare(b.name,'ko')})}
function seasonPicker(){return '<label>조회 시즌</label><select id="seasonPicker">'+db.seasons.map(s=>'<option value="'+escapeHtml(s.id)+'" '+(s.id===season?'selected':'')+'>'+escapeHtml(s.name)+(s.active?' · 진행 중':'')+'</option>').join('')+'</select>'}
function rankRows(list){let rank=0;return list.map(p=>{const n=p.w+p.l;if(n)rank++;return '<div class="row"><span style="width:25px;color:#f1cd7c">'+(n?rank:'—')+'</span><div style="flex:1"><button class="clickname" data-action="profile" data-id="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</button><div class="muted">'+(n?tier(p.rp,n)+' · '+p.w+'승 '+p.l+'패':'UNRANKED · 0경기')+'</div></div><b>'+(n?fmt(p.rp)+' RP':'배치 대기')+'</b></div>'}).join('')||'<p class="muted">선수가 없습니다.</p>'}
function home(){const ranked=leaders().filter(p=>p.w+p.l>0),count=db.matches.filter(m=>m.season_id===season).length;return '<section class="panel">'+seasonPicker()+'<h2 style="margin-top:15px">리그 현황</h2><div class="stats"><div class="stat"><b>'+db.players.length+'</b><small>선수</small></div><div class="stat"><b>'+count+'</b><small>경기</small></div><div class="stat"><b>'+(ranked.length?fmt(ranked[0].rp):'—')+'</b><small>최고 RP</small></div></div><div class="notice">랭크 '+ranked.length+'명 · UNRANKED '+(db.players.length-ranked.length)+'명</div></section><section class="panel"><h2>TOP 10</h2>'+rankRows(ranked.slice(0,10))+'</section><button class="primary wide" data-tab="match">+ 경기 등록</button>'}
function ranking(){return '<section class="panel">'+seasonPicker()+'<h2 style="margin-top:14px">통합 개인 랭킹</h2><div class="notice">3:3 · 4:4 · 4:3 · 3:4 통합 / 경기 0회는 UNRANKED</div>'+rankRows(leaders())+'</section>'}
function players(){return '<section class="panel"><h2>선수 등록</h2><label>이름</label><input id="name" maxlength="24"><label>소속 (선택)</label><input id="team" maxlength="40"><button class="primary wide" data-action="addPlayer">등록</button></section><section class="panel"><h2>선수 목록 · 프로필</h2>'+db.players.map(p=>'<div class="row"><div style="flex:1"><button class="clickname" data-action="profile" data-id="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</button><div class="muted">'+escapeHtml(p.team||'소속 없음')+' · '+(evaluated(p)?'OVR '+fmt(ovr(p)):'미평가')+'</div></div><div><button class="secondary mini" data-action="profile" data-id="'+escapeHtml(p.id)+'">프로필</button> <button class="secondary mini" data-action="editPlayer" data-id="'+escapeHtml(p.id)+'">수정</button> <button class="secondary mini danger" data-action="deletePlayer" data-id="'+escapeHtml(p.id)+'">삭제</button></div></div>').join('')+'</section>'}
function polygon(vals,r=100){return vals.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/5;return (150+Math.cos(a)*v*r/10).toFixed(1)+','+(145+Math.sin(a)*v*r/10).toFixed(1)}).join(' ')}
function radar(p){const vals=fields.map(([k])=>p[statKey(k)]);const guides=[2.5,5,7.5,10].map(v=>'<polygon points="'+polygon([v,v,v,v,v])+'" fill="none" stroke="#6684a7" stroke-opacity=".45"/>').join('');const axes=fields.map(([,name],i)=>{const a=-Math.PI/2+i*Math.PI*2/5;return '<line x1="150" y1="145" x2="'+(150+Math.cos(a)*100)+'" y2="'+(145+Math.sin(a)*100)+'" stroke="#6684a7" stroke-opacity=".3"/><text x="'+(150+Math.cos(a)*128)+'" y="'+(145+Math.sin(a)*128)+'" fill="#dcecff" text-anchor="middle" dominant-baseline="middle" font-size="12">'+name+'</text>'}).join('');return '<svg class="chart" viewBox="0 0 300 290" role="img" aria-label="선수 오각형 능력치">'+guides+axes+'<polygon points="'+polygon(vals)+'" fill="#368ce8" fill-opacity=".33" stroke="#61adff" stroke-width="2.5"/></svg>'}
function playerTimeline(id){const state={};db.players.forEach(p=>state[p.id]=1000);const timeline=[{rp:1000,label:'시작'}],records=[];const games=db.matches.filter(m=>m.season_id===season).slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))||String(a.id).localeCompare(String(b.id)));for(const m of games){const a=m.team_a,b=m.team_b;if(!Array.isArray(a)||!Array.isArray(b)||![3,4].includes(a.length)||![3,4].includes(b.length)||!['A','B'].includes(m.winner))continue;const ids=[...a,...b];if(new Set(ids).size!==ids.length||!ids.every(x=>state[x]!==undefined))continue;const ra=a.reduce((sum,x)=>sum+state[x],0)/a.length,rb=b.reduce((sum,x)=>sum+state[x],0)/b.length;const delta=32*((m.winner==='A'?1:0)-1/(1+Math.pow(10,(rb-ra)/400)));a.forEach(x=>state[x]+=delta);b.forEach(x=>state[x]-=delta);if(ids.includes(id)){const win=(a.includes(id)?m.winner==='A':m.winner==='B'),d=a.includes(id)?delta:-delta;timeline.push({rp:state[id],label:String(timeline.length)});records.push({m,win,delta:d,rp:state[id]})}}return {timeline,records}}
function rpGraph(points){if(points.length<2)return '<div class="notice">경기 기록이 쌓이면 RP 변화 그래프가 표시됩니다.</div>';const w=660,h=220,pad=38,values=points.map(x=>x.rp),min=Math.floor((Math.min(...values)-18)/20)*20,max=Math.ceil((Math.max(...values)+18)/20)*20,range=Math.max(1,max-min);const xy=(v,i)=>[(pad+(w-pad*2)*i/(points.length-1)),(h-pad-(v-min)/range*(h-pad*2))];const path=points.map((v,i)=>(i?'L':'M')+xy(v,i).map(n=>n.toFixed(1)).join(' ')).join(' ');const labels=[min,Math.round((min+max)/2),max].map(v=>'<text x="4" y="'+(h-pad-(v-min)/range*(h-pad*2))+'" fill="#adc5e1" font-size="12">'+fmt(v)+'</text>').join('');return '<svg class="svgline" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="시즌 RP 변화 그래프"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#6883a5"/>'+labels+'<path d="'+path+'" fill="none" stroke="#60b2ff" stroke-width="3" stroke-linejoin="round"/>'+points.map((v,i)=>'<circle cx="'+xy(v,i)[0]+'" cy="'+xy(v,i)[1]+'" r="3" fill="#b9e1ff"/>').join('')+'</svg>'}
function profile(){const p=db.players.find(x=>x.id===profileId);if(!p)return '<section class="panel">선수를 선택해 주세요.</section>';const ss=stats[p.id]||{rp:1000,w:0,l:0},n=ss.w+ss.l,rank=leaders().filter(x=>x.w+x.l).findIndex(x=>x.id===p.id)+1,t=playerTimeline(p.id),peak=Math.max(...t.timeline.map(x=>x.rp));let streak=0,maxStreak=0;for(const r of t.records){streak=r.win?streak+1:0;maxStreak=Math.max(streak,maxStreak)}const top=evaluated(p)?fields.filter(([k])=>p[statKey(k)]===Math.max(...fields.map(([x])=>p[statKey(x)]))).map(x=>x[1]).join('·')+' 강점':'미평가';return '<section class="panel"><button class="secondary mini" data-tab="players">← 선수 목록</button>'+seasonPicker()+'<h2 style="margin-top:15px">'+escapeHtml(p.name)+' · PLAYER PROFILE</h2><div class="muted">'+escapeHtml(p.team||'소속 없음')+' · '+tier(ss.rp,n)+' · '+(rank?'시즌 '+rank+'위':'UNRANKED')+'</div><div class="stats" style="margin-top:14px"><div class="stat"><b>'+fmt(ss.rp)+'</b><small>현재 RP</small></div><div class="stat"><b>'+fmt(peak)+'</b><small>시즌 최고 RP</small></div><div class="stat"><b>'+(n?Math.round(ss.w/n*100)+'%':'—')+'</b><small>승률</small></div><div class="stat"><b>'+n+'</b><small>경기</small></div><div class="stat"><b>'+ss.w+' / '+ss.l+'</b><small>승 / 패</small></div><div class="stat"><b>'+maxStreak+'</b><small>시즌 최다 연승</small></div></div></section><section class="panel"><h2>RP 변화 추이</h2>'+rpGraph(t.timeline)+'</section><section class="panel"><h2>최근 경기 (최대 5경기)</h2>'+(t.records.length?t.records.slice(-5).reverse().map(r=>'<div class="row"><div><b class="'+(r.win?'good':'')+'">'+(r.win?'승리':'패배')+'</b><div class="muted">'+escapeHtml(new Date(r.m.created_at).toLocaleString('ko-KR'))+' · '+r.m.team_a.length+':'+r.m.team_b.length+'</div></div><div style="text-align:right"><b>'+(r.delta>=0?'+':'')+r.delta.toFixed(1)+' RP</b><div class="muted">경기 후 '+fmt(r.rp)+' RP</div></div></div>').join(''):'<p class="muted">이번 시즌 경기 기록이 없습니다.</p>')+'</section><section class="panel"><h2>선수 능력치</h2><div class="notice">'+(evaluated(p)?'OVR '+fmt(ovr(p))+' / 10 · '+top:'미평가 · 능력치 평가 가능')+'</div>'+(evaluated(p)?radar(p):'<div class="notice">아직 평가되지 않았습니다.</div>')+fields.map(([k,name])=>'<div class="statrow"><label>'+name+'</label><div class="bar"><i style="width:'+((p[statKey(k)]??0)*10)+'%"></i></div><b style="width:35px">'+(p[statKey(k)]??'—')+'</b></div>').join('')+'<h3>선수 능력치 입력</h3><div class="muted">누구나 0~10 정수로 평가할 수 있습니다.</div>'+fields.map(([k,name])=>'<label>'+name+'</label><input type="number" id="stat_'+k+'" min="0" max="10" step="1" value="'+(p[statKey(k)]??'')+'" placeholder="0~10">').join('')+'<button class="primary wide" data-action="saveStats">능력치 저장</button></section>'}
function options(){return '<option value="">선수 선택</option>'+db.players.map(p=>'<option value="'+escapeHtml(p.id)+'">'+escapeHtml(p.name)+'</option>').join('')}
function slots(side,n){return Array.from({length:n},(_,i)=>'<select class="slot" data-side="'+side+'" data-index="'+i+'">'+options()+'</select>').join('')}
function match(){const active=db.seasons.find(s=>s.active);if(!active)return '<section class="panel">활성 시즌이 없습니다.</section>';return '<section class="panel"><h2>'+(editing?'경기 수정':'경기 등록')+'</h2><div class="notice">'+escapeHtml(active.name)+' · 3판 2선승 · 통합 RP</div><div class="grid"><div><label>A팀 인원</label><select id="sizeA"><option value="3" '+(sizeA===3?'selected':'')+'>3명</option><option value="4" '+(sizeA===4?'selected':'')+'>4명</option></select></div><div><label>B팀 인원</label><select id="sizeB"><option value="3" '+(sizeB===3?'selected':'')+'>3명</option><option value="4" '+(sizeB===4?'selected':'')+'>4명</option></select></div></div><div class="grid" style="margin-top:12px"><div class="team"><h3>A팀 · '+sizeA+'명</h3>'+slots('A',sizeA)+'</div><div class="team"><h3>B팀 · '+sizeB+'명</h3>'+slots('B',sizeB)+'</div></div><div class="notice">경기 유형 '+sizeA+':'+sizeB+' · 총 '+(sizeA+sizeB)+'명</div><label>팀 편성 기준</label><select id="balanceMode"><option value="rp">RP 균형</option><option value="stats">능력치 균형</option><option value="both">종합 균형 (RP + 능력치)</option></select><button class="secondary wide" data-action="balance">선택한 선수로 균형 팀 편성</button><label>승리 팀</label><select id="winner"><option value="A">A팀</option><option value="B">B팀</option></select><label>최종 결과</label><select id="loserSets"><option value="0">2:0</option><option value="1">2:1</option></select><button class="primary wide" data-action="addMatch">'+(editing?'수정 저장':'경기 결과 저장')+'</button>'+(editing?'<button class="secondary wide" data-action="cancelEdit">수정 취소</button>':'')+'</section>'}
function matchSelectOptions(ids,selectedId){return ids.map(id=>{const p=db.players.find(x=>x.id===id);return '<option value="'+escapeHtml(id)+'" '+(id===selectedId?'selected':'')+'>'+escapeHtml(p?.name||'알 수 없음')+'</option>'}).join('')}
function matchReady(){const total=matching.sizes.reduce((a,b)=>a+b,0);return matching.attendees.length>=total&&matching.sizes.every(n=>n===3||n===4)}
function setMatchingSize(i,n){matching.sizes[i]=n;matching.teams=[];matching.waiting=[];render()}
function matchingView(){const m=matching,total=m.sizes.reduce((a,b)=>a+b,0),ready=matchReady(),ids=m.attendees,unrated=ids.filter(id=>{const p=db.players.find(x=>x.id===id);return !p||!evaluated(p)});let out='<section class="panel"><h2>TEAM MATCHING · 참석 선수 선택</h2><div class="notice">참석 선수를 선택하고 팀별 인원을 지정하세요. 대기 선수도 설정할 수 있습니다.</div><div class="grid">'+db.players.map(p=>'<label class="listcheck"><input type="checkbox" class="attendee" value="'+escapeHtml(p.id)+'" '+(ids.includes(p.id)?'checked':'')+'><span>'+escapeHtml(p.name)+' <span class="muted">'+fmt(stats[p.id]?.rp??1000)+' RP</span></span></label>').join('')+'</div><div class="btnline" style="margin-top:12px"><button class="secondary mini" data-action="attendAll">전체 선택</button><button class="secondary mini" data-action="attendNone">전체 해제</button></div><div class="notice">참석 '+ids.length+'명 · 편성 '+total+'명 · 대기 '+Math.max(0,ids.length-total)+'명</div></section>';
out+='<section class="panel"><h2>팀별 인원 설정</h2><label>팀 개수</label><select id="matchTeamCount">'+[2,3,4].map(n=>'<option value="'+n+'" '+(m.sizes.length===n?'selected':'')+'>'+n+'팀</option>').join('')+'</select><div class="grid">'+m.sizes.map((n,i)=>'<div><label>TEAM '+String.fromCharCode(65+i)+'</label><select class="teamSize" data-index="'+i+'"><option value="3" '+(n===3?'selected':'')+'>3명</option><option value="4" '+(n===4?'selected':'')+'>4명</option></select></div>').join('')+'</div><label>자동 배분 기준</label><select id="matchMode"><option value="rp" '+(m.mode==='rp'?'selected':'')+'>RP 균형</option><option value="stats" '+(m.mode==='stats'?'selected':'')+'>능력치 균형</option><option value="both" '+(m.mode==='both'?'selected':'')+'>종합 균형 (RP + 능력치)</option><option value="random" '+(m.mode==='random'?'selected':'')+'>완전 랜덤</option></select>'+(unrated.length&&['stats','both'].includes(m.mode)?'<div class="notice">미평가 선수가 '+unrated.length+'명 있습니다. 능력치 기반 편성은 전체 선수 평가가 필요합니다.</div>':'')+(!ready?'<div class="notice">참석 인원이 부족합니다. 편성 인원 '+total+'명 이상을 선택하세요.</div>':'')+'<button class="primary wide" data-action="generateTeams" '+(!ready?'disabled':'')+'>팀 자동 배분'+(m.teams.length?' · 다시 편성':'')+'</button></section>';
if(!m.teams.length)return out;out+='<section class="panel"><h2>편성 결과 · 수동 조정</h2><div class="notice">각 선수의 배정 위치를 바꾸면 두 선수가 서로 교환됩니다. 대기 선수와도 교환할 수 있습니다.</div><div class="grid">'+m.teams.map((team,i)=>'<div class="teamcard"><h3>TEAM '+String.fromCharCode(65+i)+' · '+team.length+'명</h3>'+team.map((id,j)=>'<select class="swapSlot" data-team="'+i+'" data-slot="'+j+'">'+matchSelectOptions(m.attendees,id)+'</select>').join('')+'<div class="muted">평균 RP '+fmt(avgTeamRp(team))+' · 평균 능력치 '+(avgTeamOvr(team)===null?'미평가 포함':avgTeamOvr(team).toFixed(1))+'</div></div>').join('')+'</div>'+(m.waiting.length?'<div class="teamcard" style="margin-top:12px"><h3>대기 선수 · '+m.waiting.length+'명</h3>'+m.waiting.map((id,j)=>'<select class="swapSlot" data-team="waiting" data-slot="'+j+'">'+matchSelectOptions(m.attendees,id)+'</select>').join('')+'</div>':'')+'</section>';
out+='<section class="panel"><h2>경기 전력 비교 및 등록</h2><div class="grid"><div><label>대결 팀 1</label><select id="pairA">'+m.teams.map((_,i)=>'<option value="'+i+'" '+(m.pair[0]===i?'selected':'')+'>TEAM '+String.fromCharCode(65+i)+'</option>').join('')+'</select></div><div><label>대결 팀 2</label><select id="pairB">'+m.teams.map((_,i)=>'<option value="'+i+'" '+(m.pair[1]===i?'selected':'')+'>TEAM '+String.fromCharCode(65+i)+'</option>').join('')+'</select></div></div>'+matchCompare()+'<button class="primary wide" data-action="sendToMatch">이 두 팀으로 경기 등록</button></section>';return out}
function avgTeamRp(ids){return ids.reduce((sum,id)=>sum+(stats[id]?.rp??1000),0)/ids.length}
function avgTeamOvr(ids){const ps=ids.map(id=>db.players.find(p=>p.id===id));return ps.every(p=>p&&evaluated(p))?ps.reduce((sum,p)=>sum+ovr(p),0)/ps.length:null}
function matchCompare(){const m=matching,a=m.teams[m.pair[0]],b=m.teams[m.pair[1]];if(!a||!b||m.pair[0]===m.pair[1])return '<div class="notice">서로 다른 두 팀을 선택해 주세요.</div>';const ra=avgTeamRp(a),rb=avgTeamRp(b),chance=100/(1+Math.pow(10,(rb-ra)/400));const averages=(ids,k)=>{const ps=ids.map(id=>db.players.find(p=>p.id===id)).filter(p=>p&&evaluated(p));return ps.length?(ps.reduce((sum,p)=>sum+p[statKey(k)],0)/ps.length).toFixed(1)+' ('+ps.length+'/'+ids.length+'명)':'미평가'};return '<div class="notice">TEAM '+String.fromCharCode(65+m.pair[0])+' '+a.length+'명 · 평균 '+fmt(ra)+' RP<br>TEAM '+String.fromCharCode(65+m.pair[1])+' '+b.length+'명 · 평균 '+fmt(rb)+' RP<br><b>RP 기반 예상 승률 '+chance.toFixed(1)+'% : '+(100-chance).toFixed(1)+'%</b><br>※ Elo 기대승률이며 실제 승리 확률을 보장하지 않습니다.</div><table class="smalltable"><thead><tr><th>능력치</th><th>TEAM '+String.fromCharCode(65+m.pair[0])+'</th><th>TEAM '+String.fromCharCode(65+m.pair[1])+'</th></tr></thead><tbody>'+fields.map(([k,label])=>'<tr><td>'+label+'</td><td>'+averages(a,k)+'</td><td>'+averages(b,k)+'</td></tr>').join('')+'</tbody></table>'}
function generateTeams(){if(!matchReady())return toast('참석 선수와 팀별 인원을 확인하세요');const m=matching,players=m.attendees.map(id=>db.players.find(p=>p.id===id)),mode=m.mode;if(['stats','both'].includes(mode)&&players.some(p=>!p||!evaluated(p)))return toast('능력치·종합 균형은 참석 선수 전원의 능력치 평가가 필요합니다');const ids=m.attendees.slice(),n=m.sizes.reduce((a,b)=>a+b,0),size=m.sizes.length;let best=null,bestScore=Infinity;const iterations=mode==='random'?1:4000;for(let attempt=0;attempt<iterations;attempt++){const arr=ids.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}let offset=0;const teams=m.sizes.map(x=>{const t=arr.slice(offset,offset+x);offset+=x;return t}),waiting=arr.slice(offset);let score=0;if(mode!=='random'){const rps=teams.map(avgTeamRp);const rpDiff=(Math.max(...rps)-Math.min(...rps))/400;let statDiff=0;if(mode!=='rp'){for(const [k] of fields){const av=teams.map(team=>team.reduce((sum,id)=>sum+db.players.find(p=>p.id===id)[statKey(k)],0)/team.length);statDiff+=(Math.max(...av)-Math.min(...av))/10/5}}score=mode==='rp'?rpDiff:mode==='stats'?statDiff:(rpDiff+statDiff)/2}if(score<bestScore){bestScore=score;best={teams,waiting}}}if(best){m.teams=best.teams;m.waiting=best.waiting;m.pair=[0,1];m.counter++;render();toast('팀 배분 완료')} }
function swapMatching(team,slot,target){const m=matching,source=team==='waiting'?m.waiting:m.teams[Number(team)],old=source?.[slot];if(!old||old===target)return;const arrays=[...m.teams,m.waiting];let location=null;for(const arr of arrays){const i=arr.indexOf(target);if(i!==-1){location={arr,i};break}}if(!location)return toast('교환할 선수를 찾을 수 없습니다');source[slot]=target;location.arr[location.i]=old;render();toast('선수 교환 완료')}
function transferMatching(){const m=matching,a=m.teams[m.pair[0]],b=m.teams[m.pair[1]];if(!a||!b||m.pair[0]===m.pair[1])return toast('대결할 두 팀을 선택하세요');pendingTeams={a:[...a],b:[...b]};sizeA=a.length;sizeB=b.length;editing=null;tab='match';render();toast('팀 명단을 경기 등록에 반영했습니다')}

function history(){const games=db.matches.filter(m=>m.season_id===season).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));return '<section class="panel">'+seasonPicker()+'<h2 style="margin-top:14px">경기 이력</h2>'+games.map(m=>'<div class="row"><div style="flex:1"><b>'+escapeHtml(new Date(m.created_at).toLocaleString('ko-KR'))+'</b> <span class="tag">'+m.team_a.length+':'+m.team_b.length+'</span><div class="muted">A: '+escapeHtml(m.team_a.map(id=>db.players.find(p=>p.id===id)?.name||'알 수 없음').join(', '))+'</div><div class="muted">B: '+escapeHtml(m.team_b.map(id=>db.players.find(p=>p.id===id)?.name||'알 수 없음').join(', '))+'</div><div class="good">'+m.winner+'팀 승 · 2:'+m.loser_sets+'</div></div><div><button class="secondary mini" data-action="editMatch" data-id="'+escapeHtml(m.id)+'">수정</button><br><button class="secondary mini danger" data-action="deleteMatch" data-id="'+escapeHtml(m.id)+'">삭제</button></div></div>').join('')+'</section>'}
function seasons(){return '<section class="panel"><h2>시즌 관리</h2><label>새 시즌 이름</label><input id="newSeason" maxlength="60"><button class="primary wide" data-action="newSeason">새 시즌 시작 (관리자)</button></section><section class="panel"><h2>시즌 목록</h2>'+db.seasons.map(s=>'<div class="row"><b>'+escapeHtml(s.name)+(s.active?' · 진행 중':'')+'</b>'+(s.active?'':'<button class="secondary mini" data-action="activateSeason" data-id="'+escapeHtml(s.id)+'">전환</button>')+'</div>').join('')+'<button class="secondary wide" data-action="backup">전체 기록 JSON 백업</button></section>'}
const tabs=[['home','홈'],['matching','팀 매칭'],['match','경기 등록'],['ranking','랭킹'],['players','선수'],['history','경기 이력'],['seasons','시즌']];
function render(){if(!loaded)return;$('nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'on':'')+'">'+label+'</button>').join('');$('app').innerHTML=({home,matching:matchingView,match,ranking,players,profile,history,seasons}[tab]||home)();if(tab==='match'&&pendingTeams&&!editing){document.querySelectorAll('[data-side="A"]').forEach((x,i)=>x.value=pendingTeams.a[i]||'');document.querySelectorAll('[data-side="B"]').forEach((x,i)=>x.value=pendingTeams.b[i]||'');pendingTeams=null}if(tab==='match'&&editing){const a=[...document.querySelectorAll('[data-side="A"]')],b=[...document.querySelectorAll('[data-side="B"]')];editing.team_a.forEach((id,i)=>{if(a[i])a[i].value=id});editing.team_b.forEach((id,i)=>{if(b[i])b[i].value=id});$('winner').value=editing.winner;$('loserSets').value=String(editing.loser_sets)}}
function selected(){return {a:[...document.querySelectorAll('[data-side="A"]')].map(x=>x.value),b:[...document.querySelectorAll('[data-side="B"]')].map(x=>x.value)}}
function changeSize(side,n){const old=selected();if(side==='A')sizeA=n;else sizeB=n;const a=old.a.slice(0,sizeA),b=old.b.slice(0,sizeB);editing=null;render();[...document.querySelectorAll('[data-side="A"]')].forEach((x,i)=>x.value=a[i]||'');[...document.querySelectorAll('[data-side="B"]')].forEach((x,i)=>x.value=b[i]||'')}
function balance(){const {a,b}=selected(),ids=[...a,...b],mode=$('balanceMode').value;if(ids.some(x=>!x)||new Set(ids).size!==ids.length)return toast('서로 다른 선수 '+ids.length+'명을 선택하세요');const ps=ids.map(id=>db.players.find(p=>p.id===id));if(mode!=='rp'&&ps.some(p=>!evaluated(p)))return toast('능력치 균형은 모든 참가 선수의 평가가 필요합니다');const n=ids.length,nA=a.length;let best=null,score=Infinity;const metric=(team,key)=>team.reduce((s,id)=>s+(db.players.find(p=>p.id===id)?.[statKey(key)]??0),0)/team.length;for(let mask=0;mask<(1<<n);mask++){const aa=[],bb=[];for(let i=0;i<n;i++)(mask&(1<<i)?aa:bb).push(ids[i]);if(aa.length!==nA)continue;const rpA=aa.reduce((s,id)=>s+stats[id].rp,0)/aa.length,rpB=bb.reduce((s,id)=>s+stats[id].rp,0)/bb.length;const rpDiff=Math.abs(rpA-rpB)/400;const statDiff=fields.reduce((s,[k])=>s+Math.abs(metric(aa,k)-metric(bb,k))/10,0)/5;const diff=mode==='rp'?rpDiff:mode==='stats'?statDiff:(rpDiff+statDiff)/2;if(diff<score){score=diff;best={a:aa,b:bb}}}if(!best)return toast('팀 편성 실패');[...document.querySelectorAll('[data-side="A"]')].forEach((x,i)=>x.value=best.a[i]);[...document.querySelectorAll('[data-side="B"]')].forEach((x,i)=>x.value=best.b[i]);toast('균형 팀 편성 완료')}
async function act(action,id){if(action==='addPlayer'){const name=$('name').value.trim(),team=$('team').value.trim();if(!name)return toast('이름을 입력하세요');if(await write('player_add',{name,team}))render();return}if(action==='profile'){profileId=id;tab='profile';render();return}if(action==='saveStats'){const values={};for(const [k] of fields){const raw=$('stat_'+k).value.trim(),n=Number(raw);if(raw===''||!Number.isInteger(n)||n<0||n>10)return toast('능력치 5개를 0~10 정수로 입력하세요');values[k]=n}if(busy)return;busy=true;try{await api('stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player_id:profileId,stats:values})});busy=false;await load(false);toast('능력치 저장 완료');render()}catch(e){busy=false;toast('오류: '+e.message)}return}if(action==='editPlayer'){const p=db.players.find(x=>x.id===id);if(!p)return;const name=prompt('선수 이름',p.name);if(name===null)return;const team=prompt('소속',p.team||'');if(team===null)return;if(await write('player_edit',{id,name:name.trim(),team:team.trim()},true))render();return}if(action==='deletePlayer'){if(confirm('선수를 삭제할까요?')&&await write('player_delete',{id},true))render();return}if(action==='balance'){balance();return}if(action==='attendAll'){matching.attendees=db.players.map(p=>p.id);matching.teams=[];render();return}if(action==='attendNone'){matching.attendees=[];matching.teams=[];render();return}if(action==='generateTeams'){generateTeams();return}if(action==='sendToMatch'){transferMatching();return}if(action==='cancelEdit'){editing=null;sizeA=4;sizeB=4;render();return}if(action==='addMatch'){const {a,b}=selected(),ids=[...a,...b];if(ids.some(x=>!x)||new Set(ids).size!==ids.length)return toast('서로 다른 선수 '+ids.length+'명을 선택하세요');if(!confirm(a.length+':'+b.length+' 경기를 저장할까요?'))return;const data={team_a:a,team_b:b,winner:$('winner').value,loser_sets:Number($('loserSets').value)};if(editing)data.id=editing.id;const ok=await write(editing?'match_edit':'match_add',data,!!editing);if(ok){editing=null;sizeA=4;sizeB=4;tab='history';render()}return}if(action==='editMatch'){const m=db.matches.find(x=>x.id===id);if(!m)return;editing=m;sizeA=m.team_a.length;sizeB=m.team_b.length;tab='match';render();return}if(action==='deleteMatch'){if(confirm('경기를 삭제할까요?')&&await write('match_delete',{id},true))render();return}if(action==='newSeason'){const name=$('newSeason').value.trim();if(!name)return toast('시즌 이름을 입력하세요');if(confirm('새 시즌을 시작할까요?')&&await write('season_create',{name},true)){season=db.seasons.find(s=>s.active)?.id||season;calculate();render()}return}if(action==='activateSeason'){if(confirm('시즌을 전환할까요?')&&await write('season_activate',{id},true)){season=id;calculate();render()}return}if(action==='backup'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jokgu-league-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;if(tab!=='match')editing=null;render()}else act(b.dataset.action,b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.classList.contains('attendee')){const id=e.target.value;if(e.target.checked){if(!matching.attendees.includes(id))matching.attendees.push(id)}else matching.attendees=matching.attendees.filter(x=>x!==id);matching.teams=[];matching.waiting=[];render()}else if(e.target.id==='matchTeamCount'){const n=Number(e.target.value);matching.sizes=Array.from({length:n},(_,i)=>matching.sizes[i]||3);matching.teams=[];render()}else if(e.target.classList.contains('teamSize')){setMatchingSize(Number(e.target.dataset.index),Number(e.target.value))}else if(e.target.id==='matchMode'){matching.mode=e.target.value;matching.teams=[];render()}else if(e.target.classList.contains('swapSlot')){swapMatching(e.target.dataset.team,Number(e.target.dataset.slot),e.target.value)}else if(e.target.id==='pairA'){matching.pair[0]=Number(e.target.value);render()}else if(e.target.id==='pairB'){matching.pair[1]=Number(e.target.value);render()}else if(e.target.id==='seasonPicker'){season=e.target.value;calculate();render()}else if(e.target.id==='sizeA')changeSize('A',Number(e.target.value));else if(e.target.id==='sizeB')changeSize('B',Number(e.target.value))});
setInterval(()=>{if(document.hidden||busy||['match','matching','players','profile','seasons'].includes(tab)||document.querySelector('input:focus,select:focus'))return;load(true)},30000);
load();
</script></body></html>
